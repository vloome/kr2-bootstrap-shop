<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Оформление заявки на Bootstrap 5 (КР №2).">
    <title>Оформление заявки — Интернет-магазин (КР №2)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="sticky-top bg-white border-bottom">
        <nav class="navbar navbar-expand-lg navbar-light container py-3">
            <a class="navbar-brand fw-bold text-primary" href="index.html">ShopProject</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html?id=1">Товар</a></li>
                    <li class="nav-item"><a class="nav-link active fw-semibold" href="order.html">Заявка</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacts.html">Контакты</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Главная</a></li>
                <li class="breadcrumb-item active" aria-current="page">Оформление заявки</li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4 p-md-5">
                    <h1 class="h3 fw-bold mb-3">Оформление заявки</h1>

                    <form action="#" method="post">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label fw-semibold small">Ваше имя *</label>
                                <input type="text" class="form-control" id="name" required placeholder="Введите имя">
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold small">Электронная почта *</label>
                                <input type="email" class="form-control" id="email" required
                                    placeholder="example@mail.ru">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-semibold small">Телефон *</label>
                                <input type="tel" class="form-control" id="phone" required
                                    placeholder="+7 (900) 000-00-00">
                            </div>
                            <div class="col-md-6">
                                <label for="productSelect" class="form-label fw-semibold small">Выберите товар *</label>
                                <select class="form-select" id="productSelect" required>
                                    <option value="">-- Выберите --</option>
                                    <option value="1">Беспроводные наушники (2 000 ₽)</option>
                                    <option value="2">Щипцы для завивки ресниц (1 000 ₽)</option>
                                    <option value="3">Набор для электромонтажа (1 500 ₽)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="comment" class="form-label fw-semibold small">Комментарий</label>
                            <textarea class="form-control" id="comment" rows="3"
                                placeholder="Ваши пожелания"></textarea>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="agreement" required>
                            <label class="form-check-label small" for="agreement">Я согласен на обработку персональных
                                данных *</label>
                        </div>

                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary px-4">Отправить заявку</button>
                            <button type="reset" class="btn btn-outline-secondary">Очистить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-muted">
        <div class="container">
            <p class="mb-1">&copy; 2026 Учебный проект. Все права защищены.</p>
            <p class="mb-0 small">Дисциплина: Фронтенд и бэкенд разработка (КР №2)</p>
        </div>
    </footer>

    <a href="#" class="to-top btn btn-primary position-fixed bottom-0 end-0 m-4 rounded-circle shadow"
        style="width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; z-index: 1000;"
        aria-label="Наверх">↑</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const orderParams = new URLSearchParams(window.location.search);
        const selectedProduct = orderParams.get("product");
        if (selectedProduct) {
            document.getElementById("productSelect").value = selectedProduct;
        }
    </script>
</body>

</html>
